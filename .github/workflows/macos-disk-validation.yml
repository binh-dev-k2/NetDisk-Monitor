name: Desktop And macOS Disk Validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/24x7-native-validation-*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  macos-native-probe:
    name: macOS disk ${{ matrix.mode }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            mode: abi-only
          - os: macos-26-intel
            mode: live
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: IOKit SDK checks (${{ matrix.mode }})
        run: bash scripts/validate-macos-disk.sh '${{ matrix.mode }}'

  desktop-build-test:
    name: Desktop build/test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy
      - name: Install existing frontend dependencies (CI only)
        run: pnpm install --frozen-lockfile
      - name: Test host dependency cohort
        run: pnpm test:host
      - name: Test frontend
        run: pnpm test --maxWorkers 2 --minWorkers 1
      - name: Build frontend
        run: pnpm build
      - name: Test Rust parent integration
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features desktop --lib --jobs 2
      - name: Test system core without desktop feature
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --lib metrics_core::tests --jobs 2
      - name: Strict desktop Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --features desktop --all-targets --jobs 2 -- -D warnings
      - name: Build Windows NSIS installer (unsigned)
        if: runner.os == 'Windows'
        run: .\node_modules\.bin\tauri.cmd build --bundles nsis --features desktop --ci -- --locked --jobs 2
      - name: Build macOS desktop binary
        if: runner.os == 'macOS'
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --features desktop,tauri/custom-protocol --jobs 2
      - name: Upload Windows NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: netdisk-monitor-windows-nsis-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload macOS executable
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: netdisk-monitor-macos
          path: src-tauri/target/release/netdisk-monitor
          if-no-files-found: error
