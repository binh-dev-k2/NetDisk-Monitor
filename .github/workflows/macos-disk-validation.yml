name: macOS Disk I/O Validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/24x7-native-validation-*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  macos-native-probe:
    name: macOS disk ${{ matrix.mode }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            mode: abi-only
          - os: macos-26-intel
            mode: live
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: IOKit SDK checks (${{ matrix.mode }})
        run: bash scripts/validate-macos-disk.sh '${{ matrix.mode }}'

  macos-build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install existing frontend dependencies (CI only)
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        run: pnpm test
      - name: Build frontend
        run: pnpm build
      - name: Test Rust parent integration
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features desktop --lib
      - name: Strict macOS Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --features desktop --all-targets -- -D warnings
      - name: Build macOS desktop binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --features desktop,tauri/custom-protocol
      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: netdisk-monitor-macos
          path: src-tauri/target/release/netdisk-monitor
