[package]
name = "netdisk-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "netdisk_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "netdisk-monitor"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Etw", "Win32_System_Threading", "Win32_System_Time"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }


[lints.clippy]
all = "warn"
pedantic = "warn"
